name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# head_ref (PR-Quellbranch) bzw. ref_name (Push-Branch) liefern denselben
# Schluessel. NICHT github.ref: der ist beim Push refs/heads/<branch>, beim PR
# refs/pull/<n>/merge — zwei Gruppen, die sich nie gegenseitig aufheben.
concurrency:
  group: quality-gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    # rz-ci-pr = UNPRIVILEGIERTER ARC-Runner im TensorFive-RZ (arm64,
    # Ubuntu 24.04) statt GitHub-hosted. Der Job ist reines Node/TypeScript; das
    # Lockfile enthaelt die linux-arm64-Optional-Deps von esbuild und rollup,
    # `npm ci` laeuft also durch.
    #
    # NICHT rz-prod: dieser Workflow ist pull_request-getriggert und fuehrt
    # damit Code aus dem PR-Branch aus, bevor ihn jemand gesehen hat. rz-prods
    # ServiceAccount arc-runner ist an cluster-admin gebunden und der Token wird
    # in den Runner-Container projiziert — eine Datei lesen wuerde reichen.
    # rz-ci-pr traegt eine SA ohne jedes RoleBinding und
    # automountServiceAccountToken: false. Der Job nutzt kein kubectl/helm/flux,
    # braucht den Token also ohnehin nicht. (Invariante aus rz-betrieb#156.)
    runs-on: rz-ci-pr
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frozen contract and test checksums
        env:
          FROZEN_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'approved-frozen-change') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run check:frozen -- --base "origin/${{ github.base_ref }}"
          else
            npm run check:frozen
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Dependency cycle check
        run: npm run check:cycles

  contract-e2e:
    # Frozen E2E tests of approved contracts. Runs only the contract suites, because
    # other E2E suites are not yet part of the CI gate.
    # Pinned to 24.04: the installed Playwright version has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Contract E2E tests (details panel field configuration)
        env:
          CI: "true"
        run: npm run test:e2e -- tests/e2e/details-panel-field-configuration.spec.ts
