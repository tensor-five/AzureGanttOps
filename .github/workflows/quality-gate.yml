name: Quality Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality-gate:
    # rz-prod = ARC-Runner im TensorFive-RZ (arm64, Ubuntu 24.04) statt
    # GitHub-hosted. Der Job ist reines Node/TypeScript; das Lockfile enthaelt
    # die linux-arm64-Optional-Deps von esbuild und rollup, `npm ci` laeuft
    # also durch.
    runs-on: rz-prod
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Dependency cycle check
        run: npm run check:cycles
